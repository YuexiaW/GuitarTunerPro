[project]
name = "guitartuner"
version = "0.1.3"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-audio-recorder>=0.86.5",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
# 桌面端专用：audioflux 只有桌面二进制，安卓/iOS 装不了（运行时走纯 numpy 回退）
desktop = [
    "audioflux>=0.1.9",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
    # 仅 Windows 桌面开发需要：audioflux 是桌面音频引擎，CI(Linux)与移动端都用不到
    # （安卓没有 audioflux 二进制，运行时走纯 numpy 回退）
    "audioflux>=0.1.9; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.mycompany"
product = "guitartuner"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

[tool.flet.android]
adaptive_icon_background = "#0F1115"

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true

# Windows 桌面打包需 audioflux; 安卓打包不包含(无安卓二进制，走纯 numpy 回退)
[tool.flet.windows]
dependencies = ["audioflux>=0.1.9"]
