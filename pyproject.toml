[project]
name = "guitartuner"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "Flet developer", email = "you@example.com" }
]
dependencies = [
    "flet>=0.86.5",
    "flet-audio-recorder>=0.86.5",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
# 桌面端专用（Windows）：audioflux 只有桌面二进制，安卓/iOS 装不了（运行时走纯 numpy 回退）；
# pyaudio 仅 Windows 有 wheel，Linux 上要编译（需 portaudio19-dev），故加平台标记
desktop = [
    "audioflux>=0.1.9; sys_platform == 'win32'",
    "pyaudio>=0.2.14; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "flet-cli>=0.86.5",
    "flet-desktop>=0.86.5",
    "flet-web>=0.86.5",
    # Integration testing with `flet test` / pytest. The `test` extra brings in
    # pytest, pytest-asyncio and the screenshot-comparison dependencies.
    "flet[test]>=0.86.5",
    # 下面两个只在 Windows 桌面开发时需要（CI 跑在 Linux 上）：
    # PyAudio 没有 Linux wheel，Linux 上必须编译（要 portaudio19-dev），会让 uv sync 直接失败；
    # audioflux 是桌面音频引擎，移动端/CI 用不到（安卓走纯 numpy 回退）
    "pyaudio>=0.2.14; sys_platform == 'win32'",
    "audioflux>=0.1.9; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.flet]
org = "com.mycompany"
product = "guitartuner"
company = "Flet"
copyright = "Copyright (C) 2023-2026 by Flet"

[tool.flet.app]
path = "src"

[tool.flet.android]
adaptive_icon_background = "#0F1115"

[tool.flet.android.permission]
"android.permission.RECORD_AUDIO" = true

# Windows 桌面打包需 pyaudio + audioflux; 安卓打包不包含(无安卓二进制)
[tool.flet.windows]
dependencies = ["audioflux>=0.1.9", "pyaudio>=0.2.14"]
